plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.springboot'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(26)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.apache.pdfbox:pdfbox:3.0.5'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testRuntimeOnly 'com.h2database:h2'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	maxHeapSize = '2g' // 통합 테스트가 메모리 H2에 식품 영양소 약 50만 행을 두 번 적재한다
}

// 데이터 구성 프로그램: ./gradlew importData --args="collect"
tasks.register('importData', JavaExec) {
	group = 'healthmeal'
	description = '공공 API 데이터를 수집·가공해 DB에 적재한다'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.springboot.pipeline.ImportData'
	workingDir = projectDir
}

// 건강검진 PDF 수치 추출기 (웹과 별도 실행): ./gradlew extractCheckup --args="검진결과.pdf"
tasks.register('extractCheckup', JavaExec) {
	group = 'healthmeal'
	description = '건강검진 결과 PDF에서 검사 수치를 추출해 출력한다'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.springboot.checkup.CheckupExtractorCli'
	workingDir = projectDir
}
