# 테스트 컨텍스트마다 별도 DB (create-drop이 다른 컨텍스트의 표를 지우지 않도록)
spring.datasource.url=jdbc:h2:mem:test-${random.uuid};MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
app.upload-dir=${java.io.tmpdir}/healthmeal-test-uploads
app.health-data-key=DINC9bWjmGVaKdp+GVqpuYepdWU0db21tKoTxRGMk54=
spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.messages.always-use-message-format=true

# 13장 폼에서 PUT·DELETE 요청 (_method 숨은 파라미터)
spring.mvc.hiddenmethod.filter.enabled=true
