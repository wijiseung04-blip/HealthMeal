<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="|#{error.recipe.title} - HealthMeal|">레시피를 찾을 수 없습니다 - HealthMeal</title>
	<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
	<!-- 11장 @ExceptionHandler(RecipeNotFoundException) → RecipeController.handleError -->
	<h1 th:text="#{error.recipe.title}">레시피를 찾을 수 없습니다</h1>
	<p th:text="#{error.recipe.body(${invalidRecipeId})}">요청한 레시피가 없습니다.</p>
	<p class="muted small" th:text="#{error.recipe.url(${url})}">요청 주소</p>
	<p><a href="/recipes" th:text="#{error.toRecipes}">레시피 목록으로</a></p>
</main>
</body>
</html>
