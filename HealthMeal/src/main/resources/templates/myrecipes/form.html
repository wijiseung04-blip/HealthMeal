<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="(${recipeId == null} ? #{myrecipe.new} : #{myrecipe.edit}) + ' - HealthMeal'">새 레시피 - HealthMeal</title>
	<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="narrow">
	<p><a href="/mypage" th:text="#{goals.back}">← 마이페이지</a></p>
	<h1 th:text="${recipeId == null} ? #{myrecipe.new.title} : #{myrecipe.edit}">새 레시피 등록</h1>
	<p class="muted" th:text="#{myrecipe.intro}">안내</p>

	<form th:action="${recipeId == null ? '/myrecipes' : '/myrecipes/' + recipeId}" th:object="${form}" method="post" novalidate>
		<label><span th:text="#{myrecipe.name}">레시피 이름</span> <input type="text" th:field="*{name}" maxlength="100"></label>
		<p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

		<label><span th:text="#{myrecipe.category}">음식 종류 (선택)</span> <input type="text" th:field="*{category}" maxlength="30" th:placeholder="#{myrecipe.category.placeholder}"></label>
		<p class="error" th:if="${#fields.hasErrors('category')}" th:errors="*{category}"></p>

		<label><span th:text="#{detail.ingredients}">재료</span> <small class="muted" th:text="#{myrecipe.ingredients.hint}">한 줄에 하나</small>
			<textarea th:field="*{ingredients}" rows="10" placeholder="양파 100g&#10;돼지고기 앞다리살 200g&#10;간장 2큰술&#10;참기름 5g&#10;소금 약간"></textarea>
		</label>
		<p class="error" th:if="${#fields.hasErrors('ingredients')}" th:errors="*{ingredients}"></p>

		<label><span th:text="#{myrecipe.steps}">조리 순서 (선택)</span> <small class="muted" th:text="#{myrecipe.steps.hint}">한 줄에 한 단계</small>
			<textarea th:field="*{steps}" rows="8" placeholder="양파를 채 썬다.&#10;팬에 기름을 두르고 돼지고기를 볶는다.&#10;간장과 양파를 넣고 볶는다."></textarea>
		</label>
		<p class="error" th:if="${#fields.hasErrors('steps')}" th:errors="*{steps}"></p>

		<div class="actions">
			<button type="submit" name="action" value="preview" th:text="#{myrecipe.preview}">재료 분석해 보기</button>
			<button type="submit" name="action" value="save" th:text="#{common.save}">저장</button>
		</div>
	</form>

	<section th:if="${preview != null}">
		<h2><span th:text="#{myrecipe.result}">재료 분석 결과</span> <small class="muted" th:text="#{myrecipe.result.note}">저장 전 미리보기</small></h2>
		<p th:with="ok=${#lists.size(preview.?[computable()])}, total=${#lists.size(preview.?[parseStatus != 'NON_FOOD'])}"
		   th:class="${ok == total ? 'notice' : 'warn'}"
		   th:text="${ok == total} ? #{myrecipe.allOk(${total})} : #{myrecipe.someOk(${total}, ${ok})}">결과</p>
		<table>
			<thead><tr><th th:text="#{myrecipe.col.input}">입력</th><th th:text="#{myrecipe.col.grams}">중량</th><th th:text="#{detail.col.food}">연결된 식품</th></tr></thead>
			<tbody>
			<tr th:each="l : ${preview}" th:if="${l.parseStatus != 'NON_FOOD'}" th:classappend="${l.computable() ? '' : 'warn-row'}">
				<td th:text="${@tr.t(l.raw)}">간장 2큰술</td>
				<td class="num">
					<span th:text="${l.grams == null ? #messages.msg('detail.gramsUnknown') : #numbers.formatDecimal(l.grams, 1, 'COMMA', 1, 'POINT') + ' g'}">30.0 g</span>
					<small class="muted" th:if="${l.gramsSource == 'CONVERTED'}" th:text="#{detail.converted}">(환산)</small>
					<small class="muted" th:if="${l.gramsSource == 'AI_ESTIMATED'}" th:text="#{detail.aiWeight}">(AI 추정 중량)</small>
				</td>
				<td th:text="${l.foodName != null and l.matchGrade != 'UNMATCHED' ? @tr.d(l.foodName) : #messages.msg('detail.foodUnknown')}">간장, 개량, 양조</td>
			</tr>
			</tbody>
		</table>
	</section>
</main>
</body>
</html>
