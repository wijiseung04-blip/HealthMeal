<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>마이페이지 - HealthMeal</title>
	<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
	<h1>마이페이지</h1>
	<p class="muted" th:text="${loginEmail}">user@example.com</p>

	<p class="notice" th:if="${message}" th:text="${message}">완료</p>
	<p class="error" th:if="${uploadError}" th:text="${uploadError}">오류</p>

	<section>
		<h2>건강검진 결과</h2>
		<p class="muted small">PDF(10MB 이하)를 올리면 본인만 내려받을 수 있습니다. 건강정보는 민감정보이므로 필요 없어지면 삭제하세요.</p>
		<form th:action="@{/mypage/checkups}" method="post" enctype="multipart/form-data" class="search">
			<input type="file" name="file" accept="application/pdf,.pdf" aria-label="건강검진 결과 PDF" required>
			<button type="submit">올리기</button>
		</form>

		<p th:if="${files.empty}">올린 파일이 없습니다.</p>
		<table th:if="${!files.empty}">
			<thead><tr><th>파일</th><th>크기</th><th>올린 날짜</th><th></th></tr></thead>
			<tbody>
			<tr th:each="f : ${files}">
				<td><a th:href="@{/mypage/checkups/{id}/file(id=${f.id})}" th:text="${f.originalName}">검진결과.pdf</a></td>
				<td class="num" th:text="|${#numbers.formatDecimal(f.size / 1024.0, 1, 'COMMA', 1, 'POINT')} KB|">120.0 KB</td>
				<td th:text="${#temporals.format(f.uploadedAt, 'yyyy-MM-dd HH:mm')}">2026-11-13 21:00</td>
				<td>
					<form th:action="@{/mypage/checkups/{id}/delete(id=${f.id})}" method="post" class="inline">
						<button type="submit">삭제</button>
					</form>
				</td>
			</tr>
			</tbody>
		</table>
	</section>
</main>
</body>
</html>
