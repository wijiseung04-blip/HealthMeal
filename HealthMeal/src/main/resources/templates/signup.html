<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>회원가입 - HealthMeal</title>
	<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="narrow">
	<h1 th:text="#{signup.title}">회원가입</h1>
	<form th:action="@{/signup}" th:object="${signupForm}" method="post" novalidate>
		<label><span th:text="#{signup.username}">아이디</span> <input type="text" th:field="*{username}" autocomplete="username" autocapitalize="none" th:placeholder="#{signup.username.placeholder}"></label>
		<p class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></p>

		<label><span th:text="#{signup.name}">이름</span> <input type="text" th:field="*{name}"></label>
		<p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

		<label><span th:text="#{signup.password}">비밀번호</span> <input type="password" th:field="*{password}" autocomplete="new-password"></label>
		<p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

		<label><span th:text="#{signup.passwordConfirm}">비밀번호 확인</span> <input type="password" th:field="*{passwordConfirm}" autocomplete="new-password"></label>
		<p class="error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></p>

		<button type="submit" th:text="#{signup.submit}">가입하기</button>
	</form>
</main>
</body>
</html>
