
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title th:text="|#{signup.title} - HealthMeal|">
        회원가입 - HealthMeal
    </title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <!-- 기존 Navbar -->
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="auth-page">

        <div class="auth-hero">

            <div class="auth-inner">

                <!-- 왼쪽 소개 영역 -->
                <section class="auth-intro">

                    <p class="auth-headline">

                        <span class="line1"
                              th:text="#{signup.hero.title1}">
                            더 건강한 내일을 위한
                        </span>

                        <span class="line2"
                              th:text="#{signup.hero.title2}">
                            건강한 시작,
                        </span>

                        <span class="line2 brand">
                            HealthMeal
                        </span>

                    </p>

                    <p class="auth-desc"
                       th:text="#{signup.hero.desc}">
                        지금 바로 회원가입하고
                        맞춤형 식단 서비스를 경험해보세요!
                    </p>


                    <!-- 실제 회원가입 건강 체크리스트 이미지 -->
                    <img
                        class="auth-art-svg auth-signup-art"
                        th:src="@{/images/02_signup_health_checklist.svg}"
                        src="/images/02_signup_health_checklist.svg"
                        th:alt="#{signup.img}">

                </section>


                <!-- 오른쪽 회원가입 카드 -->
                <div class="auth-card">

                    <h1 th:text="#{signup.title}">
                        회원가입
                    </h1>

                    <p class="auth-sub"
                       th:text="#{signup.subtitle}">
                        건강한 식습관의 시작, 지금 바로 시작해보세요!
                    </p>


                    <!-- 회원가입 Form -->
                    <form
                        th:action="@{/signup}"
                        th:object="${signupForm}"
                        method="post"
                        novalidate>


                        <!-- 아이디 -->
                        <label class="lbl" for="username">
                            <span th:text="#{signup.username}">
                                아이디
                            </span>

                            <span class="req" aria-hidden="true">*</span>
                        </label>

                        <span class="field">

                            <svg width="20" height="20"
                                 viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="1.8"
                                 stroke-linecap="round"
                                 stroke-linejoin="round"
                                 aria-hidden="true">
                                <circle cx="12" cy="8" r="4"/>
                                <path d="M4 21c1.2-4 4.2-6 8-6s6.8 2 8 6"/>
                            </svg>

                            <input
                                type="text"
                                th:field="*{username}"
                                autocomplete="username"
                                autocapitalize="none"
                                th:placeholder="#{signup.username.placeholder}">

                        </span>

                        <p class="error"
                           th:if="${#fields.hasErrors('username')}"
                           th:errors="*{username}">
                        </p>


                        <!-- 이름 -->
                        <label class="lbl" for="name">

                            <span th:text="#{signup.name}">
                                이름
                            </span>

                            <span class="req" aria-hidden="true">*</span>

                        </label>

                        <span class="field">

                            <svg width="20" height="20"
                                 viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="1.8"
                                 stroke-linecap="round"
                                 stroke-linejoin="round"
                                 aria-hidden="true">
                                <circle cx="12" cy="8" r="4"/>
                                <path d="M4 21c1.2-4 4.2-6 8-6s6.8 2 8 6"/>
                            </svg>

                            <input
                                type="text"
                                th:field="*{name}"
                                th:placeholder="#{signup.name.placeholder}">

                        </span>

                        <p class="error"
                           th:if="${#fields.hasErrors('name')}"
                           th:errors="*{name}">
                        </p>


                        <!-- 비밀번호 -->
                        <label class="lbl" for="password">

                            <span th:text="#{signup.password}">
                                비밀번호
                            </span>

                            <span class="req" aria-hidden="true">*</span>

                        </label>

                        <span class="field">

                            <svg width="20" height="20"
                                 viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="1.8"
                                 stroke-linecap="round"
                                 stroke-linejoin="round"
                                 aria-hidden="true">
                                <rect x="4" y="10" width="16" height="11" rx="2.5"/>
                                <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                            </svg>

                            <input
                                type="password"
                                th:field="*{password}"
                                autocomplete="new-password"
                                th:placeholder="#{signup.password.placeholder}">

                        </span>

                        <p class="error"
                           th:if="${#fields.hasErrors('password')}"
                           th:errors="*{password}">
                        </p>


                        <!-- 비밀번호 확인 -->
                        <label class="lbl" for="passwordConfirm">

                            <span th:text="#{signup.passwordConfirm}">
                                비밀번호 확인
                            </span>

                            <span class="req" aria-hidden="true">*</span>

                        </label>

                        <span class="field">

                            <svg width="20" height="20"
                                 viewBox="0 0 24 24"
                                 fill="none"
                                 stroke="currentColor"
                                 stroke-width="1.8"
                                 stroke-linecap="round"
                                 stroke-linejoin="round"
                                 aria-hidden="true">
                                <rect x="4" y="10" width="16" height="11" rx="2.5"/>
                                <path d="M8 10V7a4 4 0 0 1 8 0v3"/>
                            </svg>

                            <input
                                type="password"
                                th:field="*{passwordConfirm}"
                                autocomplete="new-password"
                                th:placeholder="#{signup.passwordConfirm.placeholder}">

                        </span>

                        <p class="error"
                           th:if="${#fields.hasErrors('passwordConfirm')}"
                           th:errors="*{passwordConfirm}">
                        </p>


                        <!-- 회원가입 버튼 -->
                        <button type="submit" class="auth-submit">

                            <span th:text="#{signup.submit}">
                                가입하기
                            </span>

                            <span aria-hidden="true">→</span>

                        </button>

                    </form>


                    <!-- 로그인 이동 -->
                    <p class="auth-links">

                        <a href="/login"
                           th:href="@{/login}"
                           th:text="#{signup.toLogin}">
                            로그인으로 돌아가기
                        </a>

                    </p>

                </div>

            </div>

        </div>

    </main>

</body>
</html>
