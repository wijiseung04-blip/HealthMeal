<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>회원가입 - HealthMeal</title>
	<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="narrow">
	<h1>회원가입</h1>
	<form th:action="@{/signup}" th:object="${signupForm}" method="post" novalidate>
		<label>이메일 <input type="email" th:field="*{email}" autocomplete="username"></label>
		<p class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>

		<label>이름 <input type="text" th:field="*{name}"></label>
		<p class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>

		<label>비밀번호 <input type="password" th:field="*{password}" autocomplete="new-password"></label>
		<p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></p>

		<label>비밀번호 확인 <input type="password" th:field="*{passwordConfirm}" autocomplete="new-password"></label>
		<p class="error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></p>

		<button type="submit">가입하기</button>
	</form>
</main>
</body>
</html>
