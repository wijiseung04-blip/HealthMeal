<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="|#{recipes.title} - HealthMeal|">레시피 - HealthMeal</title>
	<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
	<h1 th:text="#{recipes.title}">레시피</h1>

	<p class="notice" th:if="${goal != null}" th:text="#{recipes.goalNotice(${#messages.msg('goal.' + goal.name())})}">안내</p>
	<form action="/recipes" method="get" class="search">
		<input type="hidden" name="goal" th:if="${goal != null}" th:value="${goal.name()}">
		<input type="search" name="q" th:value="${q}" th:placeholder="#{recipes.search.placeholder}" th:aria-label="#{home.search.label}">
		<select name="category" th:aria-label="#{recipes.category}">
			<option value="" th:text="#{recipes.allCategories}">전체 종류</option>
			<option th:each="c : ${categories}" th:value="${c}" th:text="${@tr.d(c)}" th:selected="${c == category}">반찬</option>
		</select>
		<button type="submit" th:text="#{home.search.button}">검색</button>
	</form>

	<p class="muted" th:text="#{recipes.count(${recipes.totalElements + ''})}">1156개 레시피</p>
	<p th:if="${recipes.empty}" th:text="#{recipes.empty}">검색 결과가 없습니다.</p>

	<ul class="cards">
		<li th:each="r : ${recipes.content}">
			<a th:href="@{/recipes/{id}(id=${r.id},goal=${goal})}">
				<img th:if="${r.mainImage != null}" th:src="${r.mainImage}" th:alt="${@tr.d(r.name)}" loading="lazy">
				<div class="noimg" th:if="${r.mainImage == null}" th:text="#{recipes.noImage}">이미지 없음</div>
				<strong th:text="${@tr.d(r.name)}">레시피 이름</strong>
				<span class="muted" th:text="|${@tr.d(r.category) ?: ''} · ${@tr.d(r.cookingMethod) ?: ''}|">반찬 · 볶기</span>
			</a>
		</li>
	</ul>

	<nav class="pager" th:if="${recipes.totalPages > 1}" th:aria-label="#{pager.label}">
		<a th:if="${recipes.hasPrevious()}" th:href="@{/recipes(q=${q},category=${category},goal=${goal},page=${recipes.number - 1})}" th:text="#{pager.prev}">이전</a>
		<span th:text="|${recipes.number + 1} / ${recipes.totalPages}|">1 / 97</span>
		<a th:if="${recipes.hasNext()}" th:href="@{/recipes(q=${q},category=${category},goal=${goal},page=${recipes.number + 1})}" th:text="#{pager.next}">다음</a>
	</nav>
</main>
</body>
</html>
