<header th:fragment="header" class="header" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
	<a href="/" class="logo">HealthMeal</a>
	<nav>
		<a href="/recipes" th:text="#{nav.recipes}">레시피</a>
		<a href="/meals" th:text="#{nav.meals}">식사 조합</a>
		<th:block sec:authorize="isAnonymous()"><!-- 10장 사용자 역할 권한 태그 -->
			<a href="/login" th:text="#{nav.login}">로그인</a>
			<a href="/signup" th:text="#{nav.signup}">회원가입</a>
		</th:block>
		<th:block sec:authorize="isAuthenticated()">
			<a href="/mypage" sec:authentication="name">user01</a><!-- 10장 사용자 인증 태그 -->
			<form action="/logout" method="post" class="inline">
				<input type="hidden" th:name="${_csrf?.parameterName}" th:value="${_csrf?.token}">
				<button type="submit" th:text="#{nav.logout}">로그아웃</button>
			</form>
		</th:block>
		<!-- 8장 다국어 변경: 요청 파라미터 lang -->
		<span class="lang">
			<a href="?lang=ko" th:text="#{nav.korean}" hreflang="ko">한국어</a> |
			<a href="?lang=en" th:text="#{nav.english}" hreflang="en">English</a>
		</span>
	</nav>
</header>
