<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="|#{hform.title} - HealthMeal|">검진 수치 확인 - HealthMeal</title>
	<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
	<p><a href="/mypage" th:text="#{goals.back}">← 마이페이지</a></p>
	<h1 th:text="#{hform.title}">검진 수치 확인</h1>

	<th:block th:if="${prepared.fromFile}">
		<p th:if="${prepared.fileName != null}" class="muted" th:text="#{hform.file(${prepared.fileName})}">파일</p>
		<th:block th:if="${!prepared.hasText}">
			<p class="warn" th:text="${prepared.image} ? #{hform.photo} : #{hform.noText}">안내</p>
			<p class="error" th:if="${prepared.aiError != null}" th:text="${@tr.t(prepared.aiError)}">오류</p>
			<form th:if="${prepared.aiAvailable}" th:action="@{/mypage/health/ai}" method="post" class="ai-consent" id="ai-form">
				<input type="hidden" name="fileId" th:value="${checkupForm.fileId}">
				<p class="small"><span th:text="#{hform.ai.note1}">안내</span>
					<strong th:text="#{hform.ai.note2}">사진에 이름·주민번호 등이 보이면 그대로 전송</strong><span th:text="#{hform.ai.note3}">됩니다.</span></p>
				<label><input type="checkbox" name="consent" value="yes" required> <span th:text="#{hform.ai.consent}">동의</span></label>
				<button type="submit" th:text="#{hform.ai.button}">AI로 수치 읽기</button>
			</form>
			<div class="ai-wait" id="ai-wait" role="status" aria-live="polite" hidden>
				<div class="ai-wait-box">
					<div class="spinner" aria-hidden="true"></div>
					<p><strong th:text="#{ai.reading}">AI가 결과표를 읽고 있습니다</strong></p>
					<p class="muted small" th:text="#{ai.starting}">판독을 시작하는 중입니다…</p>
					<p class="muted small" id="ai-wait-time" th:text="#{ai.seconds(0)}">0초</p>
				</div>
			</div>
			<script th:inline="javascript">
				(function () {
					var SEC = /*[[#{ai.sec}]]*/ '초', SLOW = /*[[#{ai.slow}]]*/ '';
					var form = document.getElementById('ai-form');
					if (!form) return;
					form.addEventListener('submit', function () {
						var wait = document.getElementById('ai-wait'), time = document.getElementById('ai-wait-time'), start = Date.now();
						wait.hidden = false;
						form.querySelector('button[type=submit]').disabled = true;
						setInterval(function () {
							var sec = Math.floor((Date.now() - start) / 1000);
							time.textContent = sec + SEC + (sec >= 60 ? SLOW : '');
						}, 1000);
					});
					// 뒤로 가기로 돌아오면 대기 화면을 닫는다
					window.addEventListener('pageshow', function () {
						document.getElementById('ai-wait').hidden = true;
						form.querySelector('button[type=submit]').disabled = false;
					});
				})();
			</script>
			<p class="muted small" th:if="${!prepared.aiAvailable}" th:text="#{hform.ai.noKey}">키 없음</p>
		</th:block>
		<p class="notice" th:if="${prepared.hasText}" th:text="${prepared.aiUsed} ? #{hform.aiFound(${prepared.extractedCount})} : #{hform.pdfFound(${prepared.extractedCount})}">안내</p>
	</th:block>
	<p th:if="${!prepared.fromFile}" th:text="#{hform.manual}">직접 입력</p>
	<p class="error" th:if="${errors['values'] != null}" th:text="${@tr.t(errors['values'])}">오류</p>

	<form th:action="@{/mypage/health}" th:object="${checkupForm}" method="post">
		<input type="hidden" th:field="*{fileId}">
		<input type="hidden" th:field="*{extractMethod}">
		<input type="hidden" th:each="e : *{extracted}" th:name="|extracted[${e.key}]|" th:value="${e.value}">

		<fieldset class="row">
			<legend><span th:text="#{profile.sex}">성별</span> <small class="muted" th:text="#{hform.sex.note}">(허리둘레 기준이 다름)</small></legend>
			<label><input type="radio" th:field="*{sex}" value="M"> <span th:text="#{sex.M}">남</span></label>
			<label><input type="radio" th:field="*{sex}" value="F"> <span th:text="#{sex.F}">여</span></label>
		</fieldset>
		<p class="error" th:if="${errors['sex'] != null}" th:text="${@tr.t(errors['sex'])}"></p>

		<label><span th:text="#{hform.examDate}">검진일</span> <small class="muted" th:text="#{common.optional}">(선택)</small> <input type="date" th:field="*{examDate}"></label>
		<p class="error" th:if="${errors['examDate'] != null}" th:text="${@tr.t(errors['examDate'])}"></p>

		<table class="checkup-form">
			<thead><tr><th th:text="#{hform.col.item}">항목</th><th th:text="#{hform.col.value}">값</th><th th:text="#{hform.col.unit}">단위</th><th></th></tr></thead>
			<tbody>
			<tr th:each="item : ${items}">
				<td><label th:for="|v-${item.name()}|" th:text="${#messages.msg('item.' + item.name())}">공복혈당</label></td>
				<td>
					<input type="text" inputmode="decimal" th:id="|v-${item.name()}|" th:name="|values[${item.name()}]|"
						   th:value="${checkupForm.values[item.name()]}" autocomplete="off">
					<p class="error" th:if="${errors[item.name()] != null}" th:text="${@tr.t(errors[item.name()])}"></p>
				</td>
				<td class="muted" th:text="${item.unit}">mg/dL</td>
				<td><small class="badge" th:if="${checkupForm.extracted[item.name()] != null}"
						th:text="${checkupForm.extractMethod == 'AI'} ? #{source.AI_EXTRACTED} : #{hform.fromPdf}">PDF에서 추출</small></td>
			</tr>
			</tbody>
		</table>
		<button type="submit" th:text="#{hform.save}">확인하고 저장</button>
	</form>
	<p class="muted small" th:text="#{hform.encrypted}">암호화</p>
</main>
</body>
</html>
