<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="|#{${mode + '.title'}} - HealthMeal|">AI 판독 중 - HealthMeal</title>
	<link rel="stylesheet" href="/css/style.css">
	<script src="/js/nutrition-game.js" defer></script>
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
	<!-- mode: ai(사진 AI 판독) / pdf(PDF 수치 읽기). 문구 키 앞부분 -->
	<p class="notice" th:text="#{${mode + '.playWhileWaiting'}}">기다리는 동안 영양 퀴즈를 해 보세요.</p>
	<!-- 기다리는 동안 하는 게임 (화면 위) -->
	<div th:replace="~{fragments/game :: game(true)}"></div>

	<!-- 읽기 진행 상황 (게임 창 아래) -->
	<div class="ai-wait-box ai-wait-page ai-progress" id="ai-progress" role="status" aria-live="polite"
		 th:data-status-url="${statusUrl}" th:data-form-url="${formUrl}">
		<div class="spinner" aria-hidden="true" id="ai-spinner"></div>
		<p><strong id="ai-title" th:text="#{${mode + '.reading'}}">AI가 결과표를 읽고 있습니다</strong></p>
		<p class="muted small" id="ai-hint" th:text="#{${mode + '.hint'}}">안내</p>
		<p class="muted small" id="ai-time" th:text="#{ai.seconds(0)}">0초</p>
		<p><button type="button" id="ai-done" class="game-start" hidden th:text="#{ai.endGame}">게임 끝내고 결과 보기</button></p>
		<p class="small" id="ai-skip"><a th:href="@{/mypage/health/new(fileId=${fileId})}" th:text="#{ai.skip}">기다리지 않고 직접 입력하기</a></p>
	</div>
	<script th:inline="javascript">
		(function () {
			var fileId = /*[[${fileId}]]*/ 0;
			var box = document.getElementById('ai-progress');
			var statusUrl = box.getAttribute('data-status-url');
			var formUrl = box.getAttribute('data-form-url');
			var time = document.getElementById('ai-time');
			var SEC = /*[[#{ai.sec}]]*/ '초', MIN = /*[[#{ai.min}]]*/ '분', SLOW = /*[[#{${mode + '.slowLong'}}]]*/ '';
			var VIEW = /*[[#{ai.viewResult}]]*/ '', DONE = /*[[#{${mode + '.done'}}]]*/ '', FAILED = /*[[#{${mode + '.doneFailed'}}]]*/ '', DONE_HINT = /*[[#{ai.doneHint}]]*/ '';
			var pageTitle = document.title;

			function elapsed(sec) {
				return Math.floor(sec / 60) > 0 ? Math.floor(sec / 60) + MIN + ' ' + (sec % 60) + SEC : sec + SEC;
			}

			// 읽기가 끝나면 알리고 버튼을 기다린다 (자동으로 넘어가지 않는다). 게임을 했으면 버튼이 게임을 끝낸다
			function finished(state) {
				var game = window.NutriGame;
				var playing = game && game.started();
				document.getElementById('ai-spinner').hidden = true;
				document.getElementById('ai-title').textContent = state === 'FAILED' ? FAILED : DONE;
				document.getElementById('ai-hint').textContent = DONE_HINT;
				document.getElementById('ai-skip').hidden = true;
				document.getElementById('ai-progress').classList.add('done');
				document.title = '✔ ' + pageTitle;
				var button = document.getElementById('ai-done');
				if (!playing) button.textContent = VIEW;
				button.hidden = false;
				button.addEventListener('click', function () {
					if (game) game.end(); // 게임 종료: 시간을 멈추고 점수를 최고 기록에 반영
					location.replace(formUrl);
				});
			}

			function poll() {
				fetch(statusUrl, {headers: {'Accept': 'application/json'}, credentials: 'same-origin'})
					.then(function (r) { return r.json(); })
					.then(function (s) {
						if (s.state === 'DONE' || s.state === 'FAILED') { time.textContent = elapsed(s.elapsedSeconds); finished(s.state); return; }
						if (s.state === 'NONE') { location.replace('/mypage/health/new?fileId=' + fileId); return; }
						time.textContent = elapsed(s.elapsedSeconds);
						if (s.elapsedSeconds >= 90) time.textContent += SLOW;
						setTimeout(poll, 2000);
					})
					.catch(function () { setTimeout(poll, 4000); });
			}
			poll();
		})();
	</script>
</main>
</body>
</html>
