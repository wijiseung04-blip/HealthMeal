<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="|#{ai.title} - HealthMeal|">AI 판독 중 - HealthMeal</title>
	<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main>
	<div class="ai-wait-box ai-wait-page" role="status" aria-live="polite">
		<div class="spinner" aria-hidden="true" id="ai-spinner"></div>
		<p><strong id="ai-title" th:text="#{ai.reading}">AI가 결과표를 읽고 있습니다</strong></p>
		<p class="muted small" id="ai-hint" th:text="#{ai.hint}">안내</p>
		<p class="muted small" id="ai-time" th:text="#{ai.seconds(0)}">0초</p>
		<p class="small"><a th:href="@{/mypage/health/new(fileId=${fileId})}" th:text="#{ai.skip}">기다리지 않고 직접 입력하기</a></p>
	</div>
	<script th:inline="javascript">
		(function () {
			var fileId = /*[[${fileId}]]*/ 0;
			var statusUrl = '/mypage/health/ai/status?fileId=' + fileId;
			var formUrl = '/mypage/health/new?ai=true&fileId=' + fileId;
			var time = document.getElementById('ai-time');
			var SEC = /*[[#{ai.sec}]]*/ '초', MIN = /*[[#{ai.min}]]*/ '분', SLOW = /*[[#{ai.slowLong}]]*/ '';
			function poll() {
				fetch(statusUrl, {headers: {'Accept': 'application/json'}, credentials: 'same-origin'})
					.then(function (r) { return r.json(); })
					.then(function (s) {
						if (s.state === 'DONE' || s.state === 'FAILED') { location.replace(formUrl); return; }
						if (s.state === 'NONE') { location.replace('/mypage/health/new?fileId=' + fileId); return; }
						var sec = s.elapsedSeconds;
						time.textContent = Math.floor(sec / 60) > 0 ? Math.floor(sec / 60) + MIN + ' ' + (sec % 60) + SEC : sec + SEC;
						if (sec >= 90) time.textContent += SLOW;
						setTimeout(poll, 2000);
					})
					.catch(function () { setTimeout(poll, 4000); });
			}
			poll();
		})();
	</script>
</main>
</body>
</html>
