<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="|#{hresult.title} - HealthMeal|">검진 결과 - HealthMeal</title>
	<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main th:with="e=${checkup.evaluation}">
	<p><a href="/mypage" th:text="#{goals.back}">← 마이페이지</a></p>
	<h1 th:text="#{hresult.title}">검진 결과와 영양 목표</h1>
	<p class="muted">
		<span th:if="${checkup.examDate != null}" th:text="#{hresult.examDate(${checkup.examDate.toString()})}">검진일</span>
		<span th:if="${checkup.fileName != null}" th:text="| · ${checkup.fileName}|"></span>
	</p>

	<div th:switch="${e.status.name()}">
		<p th:case="'MEDICAL_CONSULTATION_RECOMMENDED'" class="warn"><strong th:text="#{hresult.medical}">의료기관 상담을 권합니다.</strong> <span th:text="#{hresult.medical.body}">설명</span></p>
		<p th:case="'MANAGEMENT_REQUIRED'" class="notice" th:text="#{hresult.manage}">관리</p>
		<p th:case="'NORMAL'" class="notice" th:text="#{hresult.normal}">정상</p>
		<p th:case="*" th:text="#{hresult.none}">없음</p>
	</div>
	<p class="warn" th:if="${e.kidneyCaution}" th:text="#{hresult.kidney}">신장</p>

	<section th:if="${!e.recommendedGoals.empty}" class="goal-box">
		<h2 th:text="#{hresult.goals}">추천 영양 목표</h2>
		<ol>
			<li th:each="g : ${e.recommendedGoals}">
				<strong th:text="${#messages.msg('goal.' + g.name())}">저나트륨</strong> (<span th:text="${@tr.d(g.nutrient)}">나트륨</span> <span th:text="${g.increase} ? #{common.increase} : #{common.decrease}">줄이기</span>)
				<a th:href="@{/recipes(goal=${g.name()})}" th:text="#{hresult.adjustLink}">이 목표로 레시피 조절하기</a>
			</li>
		</ol>
		<p><span th:text="#{hresult.made}">이 결과로 만들었습니다:</span> <a href="/mypage/goals" th:text="#{mypage.goals}">내 영양 목표</a> · <a href="/mypage/profile" th:text="#{goals.profileLink}">프로필</a> <span th:text="#{hresult.profileHint}">안내</span></p>
	</section>

	<section>
		<h2 th:text="#{hresult.items}">항목별 판정</h2>
		<table>
			<thead><tr><th th:text="#{hform.col.item}">항목</th><th th:text="#{hform.col.value}">값</th><th th:text="#{adjust.col.verdict}">판정</th><th th:text="#{hresult.col.input}">입력</th></tr></thead>
			<tbody>
			<tr th:each="j : ${e.items}">
				<td th:text="${#messages.msg('item.' + j.item.name())}">공복혈당</td>
				<td class="num" th:text="|${#numbers.formatDecimal(j.value, 1, 'COMMA', 1, 'POINT')} ${j.item.unit}|">98 mg/dL</td>
				<td th:switch="${j.judgment.name()}">
					<span th:case="'NORMAL'" th:text="${@tr.t(j.message)}">정상 범위</span>
					<span th:case="*" th:classappend="${j.medical} ? 'warn-text' : ''" th:text="${@tr.t(j.message)}">경계</span>
				</td>
				<td class="muted small" th:switch="${checkup.sources[j.item]}">
					<span th:case="'TEXT_EXTRACTED'" th:text="#{source.TEXT_EXTRACTED}">PDF 추출</span>
					<span th:case="'AI_EXTRACTED'" th:text="#{source.AI_EXTRACTED}">AI 판독</span>
					<span th:case="'USER_EDITED'" th:text="#{source.USER_EDITED}">추출 후 수정</span>
					<span th:case="*" th:text="#{source.USER_ENTERED}">직접 입력</span>
				</td>
			</tr>
			</tbody>
		</table>
		<p class="muted small" th:text="#{hresult.criteria}">판정 기준</p>
	</section>

	<form th:action="@{/mypage/health/{id}/delete(id=${checkup.id})}" method="post" class="inline">
		<button type="submit" th:text="#{hresult.delete}">이 검진 결과 삭제</button>
	</form>
</main>
</body>
</html>
