<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:text="|#{login.title} - HealthMeal|">로그인 - HealthMeal</title>
	<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="narrow">
	<h1 th:text="#{login.title}">로그인</h1>
	<p class="notice" th:if="${param.signup}" th:text="#{login.signedUp}">가입이 완료되었습니다. 로그인하세요.</p>
	<p class="error" th:if="${param.error}" th:text="#{login.error}">아이디 또는 비밀번호가 올바르지 않습니다.</p>
	<p class="notice" th:if="${param.logout}" th:text="#{login.loggedOut}">로그아웃했습니다.</p>
	<form th:action="@{/login}" method="post">
		<label><span th:text="#{login.username}">아이디</span> <input type="text" name="username" required autocomplete="username" autocapitalize="none"></label>
		<label><span th:text="#{login.password}">비밀번호</span> <input type="password" name="password" required autocomplete="current-password"></label>
		<button type="submit" th:text="#{login.submit}">로그인</button>
	</form>
	<p><a href="/signup" th:text="#{login.toSignup}">회원가입</a></p>
</main>
</body>
</html>
