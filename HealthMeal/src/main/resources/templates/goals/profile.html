<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>내 프로필 - HealthMeal</title>
	<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<main class="narrow">
	<p><a href="/mypage/goals" th:text="#{profile.back}">← 내 영양 목표</a></p>
	<h1 th:text="#{mypage.profile}">내 프로필</h1>
	<p class="muted" th:text="#{profile.intro}">안내</p>
	<form th:action="@{/mypage/profile}" th:object="${form}" method="post" novalidate>
		<label><span th:text="#{profile.birthYear}">출생연도</span> <input type="number" th:field="*{birthYear}" th:placeholder="#{profile.eg('1995')}"></label>
		<p class="error" th:if="${#fields.hasErrors('birthYear')}" th:errors="*{birthYear}"></p>

		<label><span th:text="#{profile.sex}">성별</span>
			<select th:field="*{sex}">
				<option value="" th:text="#{common.notSelected}">선택 안 함</option>
				<option value="M" th:text="#{sex.M}">남성</option>
				<option value="F" th:text="#{sex.F}">여성</option>
			</select>
		</label>
		<p class="error" th:if="${#fields.hasErrors('sex')}" th:errors="*{sex}"></p>

		<label><span th:text="#{profile.height}">키 (cm)</span> <input type="number" step="0.1" th:field="*{heightCm}" th:placeholder="#{profile.eg('170')}"></label>
		<p class="error" th:if="${#fields.hasErrors('heightCm')}" th:errors="*{heightCm}"></p>

		<label><span th:text="#{profile.weight}">몸무게 (kg)</span> <input type="number" step="0.1" th:field="*{weightKg}" th:placeholder="#{profile.eg('65')}"></label>
		<p class="error" th:if="${#fields.hasErrors('weightKg')}" th:errors="*{weightKg}"></p>

		<label><span th:text="#{profile.activity}">평소 활동량</span>
			<select th:field="*{activity}">
				<option value="" th:text="#{common.notSelected}">선택 안 함</option>
				<option th:each="a : ${activities}" th:value="${a.name()}" th:text="${#messages.msg('activity.' + a.name())}">저활동적</option>
			</select>
		</label>
		<p class="error" th:if="${#fields.hasErrors('activity')}" th:errors="*{activity}"></p>

		<label><span th:text="#{profile.excluded}">식사 조합에서 뺄 식품 (선택)</span> <input type="text" th:field="*{excludedFoods}" th:placeholder="#{profile.excluded.placeholder}"></label>
		<p class="error" th:if="${#fields.hasErrors('excludedFoods')}" th:errors="*{excludedFoods}"></p>

		<button type="submit" th:text="#{common.save}">저장</button>
	</form>
</main>
</body>
</html>
