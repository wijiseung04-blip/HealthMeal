spring.application.name=HealthMeal

# MySQL (값은 환경변수로 덮어쓸 수 있음)
# rewriteBatchedStatements: 식품 영양소 약 35만 행 일괄 입력을 빠르게
# allowPublicKeyRetrieval·useSSL: 로컬 MySQL 8 접속 오류 방지 (로컬 개발용)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/healthmeal?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

logging.level.com.springboot=INFO
