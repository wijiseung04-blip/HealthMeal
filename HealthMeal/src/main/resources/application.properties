spring.application.name=HealthMeal

# MySQL (값은 환경변수로 덮어쓸 수 있음)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/healthmeal?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

logging.level.com.springboot=INFO
