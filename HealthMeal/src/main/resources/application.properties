spring.application.name=HealthMeal
# 실행 폴더의 .env (KEY=VALUE)를 읽어 아래 ${...} 값으로 쓴다. 없으면 무시 (예시: .env.example)
spring.config.import=optional:file:.env[.properties]

# MySQL (값은 환경변수로 덮어쓸 수 있음)
# rewriteBatchedStatements: 식품 영양소 약 35만 행 일괄 입력을 빠르게
# allowPublicKeyRetrieval·useSSL: 로컬 MySQL 8 접속 오류 방지 (로컬 개발용)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/healthmeal?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# 8장 다국어: messages 폴더의 메시지 리소스 (messages_ko / messages_en)
spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false
spring.messages.always-use-message-format=true

# 12장 Log4j2 설정 파일 (콘솔 + logs/monitor.log)
logging.config=classpath:logging/log4j2.xml

# 업로드: 공개 폴더 밖에 저장 (실행 폴더 기준 uploads/)
app.upload-dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# 건강검진 수치 암호화 키 (32바이트 Base64). 아래 기본값은 로컬 개발용이므로 실제 운영에서는 HEALTH_DATA_KEY를 반드시 지정한다
app.health-data-key=${HEALTH_DATA_KEY:gC2ASOjGwfOMt4/hvrvbwZGQWclHIfch0ofyuyOUCcs=}

# 13장 폼에서 PUT·DELETE 요청 (_method 숨은 파라미터)
spring.mvc.hiddenmethod.filter.enabled=true
